<h2 class="form-title">{{ isEdit ? 'Modifier un Logement' : 'Ajouter un Logement' }}</h2>

<form [formGroup]="logementForm" (ngSubmit)="onSubmit()" class="logement-form">
  <div class="form-group">
    <label for="reference">Référence</label>
    <input id="reference" formControlName="reference" type="number" />
  </div>

  <div class="form-group">
    <label for="adresse">Adresse</label>
    <input id="adresse" formControlName="adresse" type="text" />
  </div>
  <div class="form-group">
    <label for="gouvernorat">Gouvernorat</label>
    <input id="gouvernorat" formControlName="gouvernorat" type="text" />
  </div>
  <div class="form-group">
    <label for="delegation">Délégation</label>
    <input id="delegation" formControlName="delegation" type="text" />
  </div>

  <div class="form-group">
    <label for="prix">Prix</label>
    <input id="prix" formControlName="prix" type="number" />
  </div>

  <div class="form-group">
    <label for="type">Type</label>
    <input id="type" formControlName="type" type="text" />
  </div>
  <div class="form-group">
    <label for="description">Description</label>
    <input id="description" formControlName="description" type="text" />
  </div>
  <div class="form-actions">
    <button type="submit" [disabled]="!logementForm.valid">✅ {{ isEdit ? 'Modifier' : 'Ajouter' }}</button>
  </div>
</form>
